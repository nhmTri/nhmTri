<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 284" width="1200" height="284" role="img" aria-label="Nguyen Hoang Minh Tri, Operations Data Analyst. A stream of records runs left to right through a quality gate; most pass, a few are held back." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root{color-scheme:light dark}
    .nm{font:700 38px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0b0b0b;letter-spacing:-.015em}
    .rl{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#184f95;letter-spacing:.2em}
    .cl{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#52514e}
    .tg{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6f6d68;letter-spacing:.2em}
    .gt{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#184f95;letter-spacing:.14em}
    .hl{fill:#b02e2d}

    .rec{opacity:.9}
    .pass{animation:run 5.2s linear infinite}
    .held{animation:held 5.2s cubic-bezier(.3,0,.2,1) infinite}
    @keyframes run{
      0%{transform:translateX(0)}
      100%{transform:translateX(1020px)}
    }
    @keyframes held{
      0%{transform:translateX(0) translateY(0);opacity:.9}
      44%{transform:translateX(470px) translateY(0);opacity:.9}
      54%{transform:translateX(476px) translateY(30px);opacity:1}
      100%{transform:translateX(476px) translateY(30px);opacity:1}
    }

    .gate{stroke:#184f95;stroke-width:2;fill:none;
          stroke-dasharray:3 4;animation:slide 1.6s linear infinite}
    @keyframes slide{to{stroke-dashoffset:-14}}

    .scan{animation:scan 2.6s ease-in-out infinite}
    @keyframes scan{0%,100%{opacity:.18}50%{opacity:.5}}

    .ln{stroke:#c3c2b7;stroke-width:1}
    .tick{animation:tick 5.2s steps(1) infinite}
    @keyframes tick{0%,54%{opacity:0}56%,100%{opacity:1}}

    @media (prefers-reduced-motion:reduce){
      .pass,.held,.gate,.scan,.tick{animation:none}
      .held{transform:translateX(476px) translateY(30px)}
      .tick{opacity:1}
    }
    @media (prefers-color-scheme:dark){
      .nm{fill:#ffffff} .cl{fill:#c3c2b7} .tg{fill:#9a9890}
      .rl{fill:#5598e7} .gt{fill:#5598e7} .ln{stroke:#383835}
    }
  </style>

  <text class="rl" x="56" y="66">OPERATIONS DATA ANALYST</text>
  <text class="nm" x="56" y="110">Nguyen Hoang Minh Tri</text>
  <text class="cl" x="56" y="140">I decide whether a number is allowed to leave the building.</text>

  <text class="tg" x="56"  y="196">FIELDWORK</text>
  <text class="gt" x="583" y="166" text-anchor="middle">QUALITY GATE</text>
  <text class="tg" x="700" y="196">HAND-OVER</text>

  <line class="ln" x1="56" y1="212" x2="1144" y2="212"/>

  <rect class="scan" x="560" y="176" width="46" height="72" rx="8" fill="#184f95"/>
  <path class="gate" d="M560 176 h46 v72 h-46 Z"/>

  <g class="rec">
    <rect class="pass" x="60"  y="204" width="18" height="16" rx="3" fill="#184f95" style="animation-delay:0s"/>
    <rect class="pass" x="60"  y="204" width="18" height="16" rx="3" fill="#5598e7" style="animation-delay:-.5s"/>
    <rect class="pass" x="60"  y="204" width="18" height="16" rx="3" fill="#184f95" style="animation-delay:-1.1s"/>
    <rect class="held" x="60"  y="204" width="18" height="16" rx="3" fill="#b02e2d" style="animation-delay:-1.6s"/>
    <rect class="pass" x="60"  y="204" width="18" height="16" rx="3" fill="#5598e7" style="animation-delay:-2.1s"/>
    <rect class="pass" x="60"  y="204" width="18" height="16" rx="3" fill="#184f95" style="animation-delay:-2.7s"/>
    <rect class="pass" x="60"  y="204" width="18" height="16" rx="3" fill="#5598e7" style="animation-delay:-3.3s"/>
    <rect class="held" x="60"  y="204" width="18" height="16" rx="3" fill="#e8736f" style="animation-delay:-3.8s"/>
    <rect class="pass" x="60"  y="204" width="18" height="16" rx="3" fill="#184f95" style="animation-delay:-4.4s"/>
  </g>

  <text class="tg" x="536" y="268" fill="#b02e2d">HELD FOR REVIEW</text>

  <g class="tick">
    <text class="tg" x="1144" y="246" text-anchor="end" fill="#184f95">41,037 SAMPLES CHECKED IN 11 MONTHS</text>
    <text class="tg" x="1144" y="268" text-anchor="end">MAJOR ERROR HELD AT 0.2% AGAINST A 5% CEILING</text>
  </g>
</svg>
