<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 96" width="820" height="96" role="img" aria-label="Language split across public repositories: Jupyter Notebook, Java, Python, Shell, Makefile, CQL, Other.">
  <style>
    :root{color-scheme:light dark}
    .s{transform-box:fill-box;transform-origin:left;transform:scaleX(0);
       animation:g .65s cubic-bezier(.2,.7,.3,1) forwards}
    @keyframes g{to{transform:scaleX(1)}}
    .l{font:500 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#52514e}
    .t{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8a8880;letter-spacing:.16em}
    @media (prefers-reduced-motion:reduce){.s{transform:scaleX(1);animation:none}}
    @media (prefers-color-scheme:dark){.l{fill:#c3c2b7}}
  </style>
  <text class="t" x="10" y="14">WHAT THE PUBLIC REPOSITORIES ARE WRITTEN IN</text>
  <rect class="s" x="10.0" y="26" width="621.4" height="16" rx="3" fill="#898781" style="animation-delay:0.00s"/>
  <rect class="s" x="633.4" y="26" width="130.8" height="16" rx="3" fill="#5598e7" style="animation-delay:0.08s"/>
  <rect class="s" x="766.2" y="26" width="36.8" height="16" rx="3" fill="#184f95" style="animation-delay:0.16s"/>
  <rect class="s" x="805.0" y="26" width="3.0" height="16" rx="3" fill="#6f6d68" style="animation-delay:0.24s"/>
  <rect class="s" x="810.0" y="26" width="3.0" height="16" rx="3" fill="#52514e" style="animation-delay:0.32s"/>
  <rect class="s" x="815.0" y="26" width="3.0" height="16" rx="3" fill="#86b6ef" style="animation-delay:0.40s"/>
  <rect class="s" x="820.0" y="26" width="3.0" height="16" rx="3" fill="#898781" style="animation-delay:0.48s"/>
  <circle cx="15.0" cy="70" r="4.5" fill="#898781"/><text class="l" x="26.0" y="74">Jupyter Notebook 78%</text>
  <circle cx="159.0" cy="70" r="4.5" fill="#5598e7"/><text class="l" x="170.0" y="74">Java 17%</text>
  <circle cx="229.8" cy="70" r="4.5" fill="#184f95"/><text class="l" x="240.8" y="74">Python 5%</text>
  <circle cx="306.7" cy="70" r="4.5" fill="#6f6d68"/><text class="l" x="317.7" y="74">Shell 0%</text>
  <circle cx="377.5" cy="70" r="4.5" fill="#52514e"/><text class="l" x="388.5" y="74">Makefile 0%</text>
  <circle cx="466.6" cy="70" r="4.5" fill="#86b6ef"/><text class="l" x="477.6" y="74">CQL 0%</text>
  <circle cx="525.2" cy="70" r="4.5" fill="#898781"/><text class="l" x="536.2" y="74">Other 0%</text>
</svg>
