<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 96" width="820" height="96" role="img" aria-label="Language split across public repositories: HTML, Jupyter Notebook, Java, Python, Shell, Makefile, Other.">
  <style>
    :root{color-scheme:light dark}
    .s{transform-box:fill-box;transform-origin:left;transform:scaleX(0);
       animation:g .65s cubic-bezier(.2,.7,.3,1) forwards}
    @keyframes g{to{transform:scaleX(1)}}
    .l{font:500 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#52514e}
    .t{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8a8880;letter-spacing:.16em}
    @media (prefers-reduced-motion:reduce){.s{transform:scaleX(1);animation:none}}
    @media (prefers-color-scheme:dark){.l{fill:#c3c2b7}}
  </style>
  <text class="t" x="10" y="14">WHAT THE PUBLIC REPOSITORIES ARE WRITTEN IN</text>
  <rect class="s" x="10.0" y="26" width="404.4" height="16" rx="3" fill="#e8736f" style="animation-delay:0.00s"/>
  <rect class="s" x="416.4" y="26" width="302.7" height="16" rx="3" fill="#898781" style="animation-delay:0.08s"/>
  <rect class="s" x="721.1" y="26" width="62.9" height="16" rx="3" fill="#5598e7" style="animation-delay:0.16s"/>
  <rect class="s" x="786.0" y="26" width="18.4" height="16" rx="3" fill="#184f95" style="animation-delay:0.24s"/>
  <rect class="s" x="806.4" y="26" width="3.0" height="16" rx="3" fill="#6f6d68" style="animation-delay:0.32s"/>
  <rect class="s" x="811.4" y="26" width="3.0" height="16" rx="3" fill="#52514e" style="animation-delay:0.40s"/>
  <rect class="s" x="816.4" y="26" width="3.0" height="16" rx="3" fill="#898781" style="animation-delay:0.48s"/>
  <circle cx="15.0" cy="70" r="4.5" fill="#e8736f"/><text class="l" x="26.0" y="74">HTML 51%</text>
  <circle cx="85.8" cy="70" r="4.5" fill="#898781"/><text class="l" x="96.8" y="74">Jupyter Notebook 38%</text>
  <circle cx="229.8" cy="70" r="4.5" fill="#5598e7"/><text class="l" x="240.8" y="74">Java 8%</text>
  <circle cx="294.5" cy="70" r="4.5" fill="#184f95"/><text class="l" x="305.5" y="74">Python 3%</text>
  <circle cx="371.4" cy="70" r="4.5" fill="#6f6d68"/><text class="l" x="382.4" y="74">Shell 0%</text>
  <circle cx="442.2" cy="70" r="4.5" fill="#52514e"/><text class="l" x="453.2" y="74">Makefile 0%</text>
  <circle cx="531.3" cy="70" r="4.5" fill="#898781"/><text class="l" x="542.3" y="74">Other 0%</text>
</svg>
